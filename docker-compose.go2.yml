# ============================================================================
#  Cấu hình cho Unitree Go2 (Jetson, arm64, KHÔNG màn hình).
#
#  Đây là file ĐỘC LẬP, không phải override. Lý do: docker compose GỘP các
#  danh sách (volumes, devices) giữa các file -f thay vì thay thế, nên không
#  có cách nào dùng override để GỠ BỎ /dev/dri hay socket X11.
#
#  run.sh tự chọn file này khi thấy máy là aarch64. Ép tay:
#      COMPOSE_FILE=docker-compose.go2.yml ./run.sh ...
# ============================================================================
services:
  slam:
    build:
      context: ./docker
      dockerfile: Dockerfile
      args:
        UID: "${HOST_UID:-1000}"     # user trên Go2 có thể không phải uid 1000
        GID: "${HOST_GID:-1000}"
    image: go2_slam:foxy
    container_name: go2_slam
    hostname: go2slam

    network_mode: host
    ipc: host

    # PID 1 biết thu dọn tiến trình mồ côi. Không có dòng này thì PID 1 là
    # `sleep infinity`, không reap, và mỗi lần Ctrl-C một launch lại tích thêm
    # vài tiến trình zombie (đã đếm được 24 cái trong một phiên trên laptop).
    init: true

    cap_add:
      - NET_ADMIN
      - NET_RAW

    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      # BẮT BUỘC khác 0, và KHÔNG được đặt tên biến là ROS_DOMAIN_ID:
      # ~/.bashrc của Go2 (dòng 149, thiết lập sẵn của Unitree) đã
      # `export ROS_DOMAIN_ID=0`, nên `${ROS_DOMAIN_ID:-42}` lấy luôn số 0 đó
      # — mặc định `:-` chỉ áp dụng khi biến CHƯA ĐẶT. Dùng tên riêng thì môi
      # trường của robot không lọt vào được.
      #
      # Vì sao phải khác 0: trên domain 0 của mạng robot có node DDS khác phát
      # gói discovery mà CycloneDDS 0.7 (bản của Foxy) phân tích sai trên
      # aarch64 rồi SẬP. Đã xác minh bằng gdb:
      #     Thread "dq.builtins" SIGSEGV
      #     #2 ddsi_plist_init_frommsg ()  from libddsc.so.0
      #     #4 builtins_dqueue_handler ()  from libddsc.so.0
      # Đo được: domain 0 -> SIGSEGV ngay; domain 42 và 77 -> chạy bình thường.
      # Nên đây không phải chuyện nhiễu lưu lượng, mà là lỗi làm chết node.
      - ROS_DOMAIN_ID=${GO2_SLAM_DOMAIN_ID:-42}
      - ROS_LOCALHOST_ONLY=0

    volumes:
      - .:/ws
      # KHÔNG mount /tmp/.X11-unix: robot không có X server.

    # KHÔNG khai báo /dev/dri: Jetson không có thiết bị đó và container sẽ
    # không khởi động được ("error gathering device information").

    stdin_open: true
    tty: true
    command: sleep infinity
