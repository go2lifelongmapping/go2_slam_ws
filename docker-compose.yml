services:
  slam:
    build:
      context: ./docker          # nơi chứa Dockerfile và entrypoint.sh
      dockerfile: Dockerfile
      args:
        UID: "1000"              # khớp id -u của bạn
        GID: "1000"
    image: go2_slam:foxy
    container_name: go2_slam
    hostname: go2slam

    network_mode: host

    # PID 1 biết thu dọn tiến trình mồ côi. Thiếu dòng này thì PID 1 là
    # `sleep infinity` (không reap) và mỗi lần Ctrl-C lại tích thêm zombie.
    init: true

    # Dùng chung IPC với host để DDS truyền qua shared memory (nhanh hơn UDP
    # loopback rất nhiều khi point cloud 10 Hz chạy giữa các node).
    ipc: host

    # Cần cho tcpdump/ethtool khi lidar cắm rồi mà không thấy dữ liệu.
    cap_add:
      - NET_ADMIN
      - NET_RAW

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1       # tránh lỗi shared-memory của Qt qua X11
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      # Cùng biến và cùng mặc định với docker-compose.go2.yml, để laptop và
      # robot tự động ở chung domain và rviz trên laptop thấy được topic của
      # Go2. Tên biến KHÔNG phải ROS_DOMAIN_ID — xem lý do ở file go2.
      - ROS_DOMAIN_ID=${GO2_SLAM_DOMAIN_ID:-42}
      - ROS_LOCALHOST_ONLY=0     # phải là 0 thì mới thấy được Go2 trên mạng

    volumes:
      - .:/ws                          # workspace: sửa ở Ubuntu 22, build ở Foxy
      - /tmp/.X11-unix:/tmp/.X11-unix:rw   # socket X11 để chạy rviz2

    devices:
      - /dev/dri:/dev/dri        # iGPU AMD cho rviz2

    stdin_open: true
    tty: true
    command: sleep infinity
